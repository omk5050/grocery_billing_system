<!DOCTYPE html>
<html>
<head>
<title>Grocery Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Bootstrap CDN -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="b-_dashboard.css">
</head>

<body>

<!-- Sidebar -->
<div class="sidebar">
  <h2>🛒 Grocery</h2>

  <ul>
    <li onclick="go('a_login.html')">Dashboard</li>

    <li onclick="go('c_product.html')">Products</li>

    <li onclick="go('d_billing.html')">Billing</li>

    <li onclick="go('e_invoice.html')">Invoice</li>

    <li onclick="go('f_history.html')">History</li>

    <li onclick="go('g_report.html')">Report</li>
    
    <li onclick="logout()">Logout</li>
  </ul>

  <button onclick="toggleMode()" class="btn btn-dark w-100 mt-3">
    🌙 Dark Mode
  </button>
</div>

<!-- Main -->
<div class="main">

  <h1 class="mb-4">📊 Dashboard</h1>

  <!-- Bootstrap Grid -->
  <div class="row g-3">

    <div class="col-md-3 col-sm-6">
      <div class="card blue text-center">
        <h5>Total Product</h5>
        <h3>45</h3>
      </div>
    </div>

    <div class="col-md-3 col-sm-6">
      <div class="card green text-center">
        <h5>Total Sales</h5>
        <h3>₹12,500</h3>
      </div>
    </div>

    <div class="col-md-3 col-sm-6">
      <div class="card orange text-center">
        <h5>Today's Bills</h5>
        <h3>18</h3>
      </div>
    </div>

    <div class="col-md-3 col-sm-6">
      <div class="card red text-center">
        <h5>Low Stock</h5>
        <h3>3 Items</h3>
      </div>
    </div>

  </div>

</div>

<script>

function go(page){
  window.location.href = page;
}

function logout(){
  window.location.href="a_login.html";
}

/* Dark Mode */
function toggleMode(){
  document.body.classList.toggle("bg-dark");
  document.body.classList.toggle("text-white");
}

</script>

</body>
</html>
