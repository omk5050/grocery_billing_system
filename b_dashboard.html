<!DOCTYPE html>
<html>
<head>
<title>Grocery Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">


<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- Sidebar -->
<div class="sidebar">
  <h2>🛒 Grocery</h2>

  <ul>
    <li onclick="go('b_dashboard.html')">Dashboard</li>

    <li onclick="go('c_product.html')">Products</li>

    <li onclick="go('d_billing.html')">Billing</li>

    <li onclick="go('e_invoice.html')">Invoice</li>

    <li onclick="go('f_history.html')">History</li>

    <li onclick="go('g_report.html')">Report</li>
    
    <li onclick="logout()">Logout</li>
  </ul>

  <button onclick="toggleMode()" class="dark-btn">
    🌙 Dark Mode
  </button>
</div>

<!-- Main -->
<div class="main">

  <h1 class="mb-4">📊 Dashboard</h1>

  <div class="cards">
    <div class="card">
      <h3>Total Product</h3>
      <p id="totalProduct">45</p>
    </div>

    <div class="card">
      <h3>Total Sales</h3>
      <p id="totalSales">₹12,500</p>
    </div>

    <div class="card">
      <h3>Today's Bills</h3>
      <p id="todayBills">18</p>
    </div>

    <div class="card">
      <h3>Low Stock</h3>
      <p>3</p>
    </div>
  </div>
</div>

<script>

function go(page){
  window.location.href = page;
}

function logout(){
  window.location.href="a_login.html";
}

/* Dark Mode */
function toggleMode(){
  document.body.classList.toggle("dark-mode");
}

</script>

</body>
</html>
