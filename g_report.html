<!DOCTYPE html>
<html>
<head>
<title>Reports</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="g-_report.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <h2>🛒 Grocery</h2>

  <ul>
    <li onclick="go('a_login.html')">Dashboard</li>
    <li onclick="go('c_product.html')">Products</li>
    <li onclick="go('d_billing.html')">Billing</li>
    <li onclick="go('e_invoice.html')">Invoice</li>
    <li onclick="go('f_history.html')">History</li>
    <li onclick="go('g_report.html')">Report</li>
    <li onclick="logout()">Logout</li>
  </ul>

  <button onclick="toggleMode()" class="dark-btn">
    🌙 Dark Mode
  </button>
</div>

<!-- HEADER -->
<div class="header">
  📊 Sales Report Dashboard
</div>

<!-- MAIN CONTAINER -->
<div class="container">

  <!-- SUMMARY CARDS -->
  <div class="cards">

    <div class="card">
      <h3>Today Sales</h3>
      <p id="todaySales">₹0</p>
    </div>

    <div class="card">
      <h3>Weekly Sales</h3>
      <p id="weekSales">₹0</p>
    </div>

    <div class="card">
      <h3>Monthly Sales</h3>
      <p id="monthSales">₹0</p>
    </div>

    <div class="card">
      <h3>Growth %</h3>
      <p id="growth">0%</p>
    </div>

  </div>

  <!-- BUTTONS -->
  <div class="buttons">
    <button onclick="showDaily()">Daily</button>
    <button onclick="showWeekly()">Weekly</button>
    <button onclick="showMonthly()">Monthly</button>
    <button onclick="exportPDF()">Export PDF</button>
  </div>

  <!-- CHART -->
  <div class="chart-box">
    <canvas id="salesChart"></canvas>
  </div>

  <!-- TOP PRODUCTS TABLE -->
  <table>

    <tr>
      <th>Product</th>
      <th>Quantity Sold</th>
      <th>Total Revenue</th>
    </tr>

    <tr>
      <td>Rice</td>
      <td>50</td>
      <td>₹5000</td>
    </tr>

    <tr>
      <td>Milk</td>
      <td>80</td>
      <td>₹3200</td>
    </tr>

    <tr>
      <td>Sugar</td>
      <td>40</td>
      <td>₹2400</td>
    </tr>

    <tr>
      <td>Oil</td>
      <td>30</td>
      <td>₹4500</td>
    </tr>

  </table>

</div>

<script>

function go(page){
  window.location.href = page;
}

function logout(){
  alert("Logged out successfully");
  window.location.href = "a_login.html";
}

function toggleMode(){
  document.body.classList.toggle("dark-mode");
}

// SAMPLE DATA
let daily = [200,300,250,400,350,500,600];
let weekly = [1500,1800,2000,2200,2500,2700,3000];
let monthly = [5000,6000,7000,8000,9000,10000,11000];

let chart;

// INIT
window.onload = function(){
  showDaily();
  calculateSummary();
}

// LOAD CHART
function loadChart(data,label){

  let ctx = document.getElementById('salesChart').getContext('2d');

  if(chart){
    chart.destroy();
  }

  chart = new Chart(ctx,{
    type:'line',

    data:{
      labels:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],

      datasets:[{
        label:label,
        data:data,
        borderWidth:2,
        fill:false
      }]
    }
  });
}

// BUTTON FUNCTIONS
function showDaily(){
  loadChart(daily,"Daily Sales");
}

function showWeekly(){
  loadChart(weekly,"Weekly Sales");
}

function showMonthly(){
  loadChart(monthly,"Monthly Sales");
}

// SUMMARY
function calculateSummary(){

  let today = daily[daily.length-1];

  let week = weekly.reduce((a,b)=>a+b,0);

  let month = monthly.reduce((a,b)=>a+b,0);

  let growth = ((week - month/4) / (month/4) * 100).toFixed(2);

  document.getElementById("todaySales").innerText = "₹" + today;

  document.getElementById("weekSales").innerText = "₹" + week;

  document.getElementById("monthSales").innerText = "₹" + month;

  document.getElementById("growth").innerText = growth + "%";
}

// EXPORT PDF
function exportPDF(){

  const { jsPDF } = window.jspdf;

  let doc = new jsPDF();

  doc.text("Sales Report",20,20);

  doc.text(
    "Today Sales: " + document.getElementById("todaySales").innerText,
    20,
    40
  );

  doc.text(
    "Weekly Sales: " + document.getElementById("weekSales").innerText,
    20,
    50
  );

  doc.text(
    "Monthly Sales: " + document.getElementById("monthSales").innerText,
    20,
    60
  );

  doc.save("report.pdf");
}

</script>

</body>
</html>
