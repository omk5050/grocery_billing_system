<!DOCTYPE html>
<html>
<head>

<title>Invoice</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">

  <h2>🛒 Grocery</h2>

  <ul>
    <li onclick="go('b_dashboard.html')">Dashboard</li>  

    <li onclick="go('c_product.html')">Products</li>

    <li onclick="go('d_billing.html')">Billing</li>

    <li onclick="go('e_invoice.html')">Invoice</li>

    <li onclick="go('f_history.html')">History</li>

    <li onclick="go('g_report.html')">Report</li>
    
    <li onclick="logout()">Logout</li>
  </ul>

  <button onclick="toggleMode()" class="dark-btn">
    🌙 Dark Mode
  </button>

</div>

<!-- MAIN CONTENT -->
<div class="invoice-box">

  <!-- HEADER -->
  <div class="header">

    <div>
      <h2>Grocery Store</h2>
      <small>Main Road, Solapur</small>
    </div>

    <div class="store-details" id="headerData"></div>

  </div>

  <!-- CUSTOMER DETAILS -->
  <div class="info" id="customerData"></div>

  <!-- TABLE -->
  <table id="billTable">

    <thead>
      <tr>
        <th>#</th>
        <th>Item</th>
        <th>Price</th>
        <th>Qty</th>
        <th>Total</th>
      </tr>
    </thead>

    <tbody></tbody>

  </table>

  <!-- TOTAL -->
  <div class="total-box" id="totalData"></div>

  <!-- FOOTER -->
  <div class="footer">

    <p>Thank you for shopping with us 🙏</p>

    <p>Visit Again!</p>

    <button onclick="window.print()">
      Print Invoice
    </button>

    <button onclick="downloadPDF()">
      Download Invoice
    </button>

    <button
      onclick="saveToHistory()"
      style="background:#3498db;"
    >
      Save to History
    </button>

    <button
      onclick="clearBill()"
      style="background:#e74c3c;"
    >
      Clear Bill
    </button>

    <button
      onclick="goHistory()"
      style="background:#f39c12;"
    >
      View History
    </button>

  </div>

</div>

<script>

/* PAGE NAVIGATION */
function go(page){
  window.location.href = page;
}

/* LOGOUT */
function logout(){

  alert("Logged out successfully");

  window.location.href = "a_login.html";
}

/* DARK MODE */
function toggleMode(){
  document.body.classList.toggle("dark-mode");
}

/* GET BILL DATA */
let data = JSON.parse(localStorage.getItem("billData"));

/* DEFAULT DATA */
if(!data){

  data = {

    invoice:"1001",

    dateTime:new Date().toLocaleString(),

    cname:"Customer",

    cmobile:"0000000000",

    gst:5,

    discount:0,

    items:[
      {
        name:"Rice",
        price:50,
        qty:2,
        total:100
      },

      {
        name:"Sugar",
        price:40,
        qty:1,
        total:40
      }
    ]
  };
}

/* HEADER DATA */
document.getElementById("headerData").innerHTML = `
<p><b>Invoice No:</b> ${data.invoice}</p>
<p><b>Date:</b> ${data.dateTime}</p>
`;

/* CUSTOMER DATA */
document.getElementById("customerData").innerHTML = `
<div>
<p><b>Customer Name:</b> ${data.cname}</p>
<p><b>Mobile:</b> ${data.cmobile}</p>
</div>
`;

/* TABLE DATA */
let tableBody = document.querySelector("#billTable tbody");

let subtotal = 0;

data.items.forEach((item,index)=>{

  subtotal += item.total;

  tableBody.innerHTML += `
  <tr>
    <td>${index+1}</td>
    <td>${item.name}</td>
    <td>₹${item.price}</td>
    <td>${item.qty}</td>
    <td>₹${item.total}</td>
  </tr>
  `;
});

/* TOTAL CALCULATION */
let gst = subtotal * data.gst / 100;

let discount = subtotal * data.discount / 100;

let grandTotal = subtotal + gst - discount;

/* DISPLAY TOTAL */
document.getElementById("totalData").innerHTML = `
<p>Sub Total: ₹${subtotal.toFixed(2)}</p>

<p>GST (${data.gst}%): ₹${gst.toFixed(2)}</p>

<p>Discount (${data.discount}%): ₹${discount.toFixed(2)}</p>

<p class="grand">
Grand Total: ₹${grandTotal.toFixed(2)}
</p>
`;

/* DOWNLOAD PDF */
function downloadPDF(){

  alert("PDF Download Ready");
}

/* SAVE HISTORY */
function saveToHistory(){
  alert("Invoice is automatically saved to the database.");
}

/* CLEAR BILL */
function clearBill(){

  localStorage.removeItem("billData");

  alert("Bill Cleared");
}

/* GO HISTORY */
function goHistory(){

  window.location.href = "f_history.html";
}

</script>

</body>
</html>
