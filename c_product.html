<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<script src="toast.js"></script>
<title>Product Management</title>

</style>
</head>

<body onload="loadProduct()">

<!-- SIDEBAR -->
<div class="sidebar">
  <h2>🛒 Grocery</h2>

  <ul>

    <li onclick="go('b_dashboard.html')">Dashboard</li>
    <li onclick="go('c_product.html')">Product</li>
    <li onclick="go('d_billing.html')">Billing</li>
    <li onclick="go('f_history.html')">History</li>
    <li onclick="go('h_register.html')">Register Admin</li>
    <li onclick="go('g_scan.html')">Scan Bill</li>
    <li onclick="logout()">Logout</li>
  </ul>
  

  <button onclick="toggleMode()">🌙 Dark Mode</button>
</div>

<!-- MAIN -->
<div class="main">

<h1>📦 Product Management</h1>

<!-- ADD PRODUCT -->
<div class="card">
  <h3>Add Product</h3>
  <br>

  <div class="form-group">
    <input type="text" id="pname" placeholder="Product Name" oninput="validateProductName()">
    <input type="number" id="pprice" placeholder="Price">
    <input type="number" id="pqty" placeholder="Quantity">
    <button onclick="addProduct()">Add Product</button>
  </div>
</div>

<!-- PRODUCT LIST -->
<div class="card">
  <h3>Product List</h3>
  <br>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Product Name</th>
          <th>Price (₹)</th>
          <th>Quantity</th>
          <th>Action</th>
        </tr>
      </thead>

      <tbody id="productTable"></tbody>
    </table>
  </div>
</div>

</div>

<script>
/* ROUTE PROTECTION */
if (localStorage.getItem("isLoggedIn") !== "true") {
  window.location.href = "a_login.html";
}

function go(page){
  window.location.href = page;
}

function validateProductName() {
  const input = document.getElementById("pname");
  if (input.value.trim() === "") {
    input.style.borderColor = "#ef4444";
    input.style.boxShadow = "0 0 0 3px rgba(239, 68, 68, 0.2)";
  } else {
    input.style.borderColor = "#10b981";
    input.style.boxShadow = "0 0 0 3px rgba(16, 185, 129, 0.2)";
  }
}

/* LOAD PRODUCTS */
async function loadProduct(){
  let table = document.getElementById("productTable");
  table.innerHTML = "<tr><td colspan='4' style='text-align:center;'>Loading products...</td></tr>";

  try {
    const response = await fetch('/api/products');
    const products = await response.json();
    table.innerHTML = "";

    if (products.length === 0) {
      table.innerHTML = "<tr><td colspan='4' style='text-align:center;'>No products found</td></tr>";
      return;
    }

    products.forEach((p)=>{
      let row = table.insertRow();

      row.insertCell(0).innerHTML = p.name;
      row.insertCell(1).innerHTML = "₹" + p.price;
      row.insertCell(2).innerHTML = p.qty;

      row.insertCell(3).innerHTML =
        `<button class="delete-btn" onclick="deleteProduct('${p._id}')">Delete</button>`;
    });
  } catch (error) {
    console.error("Error loading products:", error);
    table.innerHTML = "<tr><td colspan='4' style='text-align:center;'>Error loading products</td></tr>";
  }
}

/* ADD PRODUCT */
async function addProduct(){
  let name = document.getElementById("pname").value.trim();
  let price = document.getElementById("pprice").value;
  let qty = document.getElementById("pqty").value;

  if(name === "" || price === "" || qty === ""){
    alert("Please fill all fields");
    return;
  }

  try {
    const response = await fetch('/api/products', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, price: Number(price), qty: Number(qty) })
    });

    if (response.ok) {
      document.getElementById("pname").value = "";
      document.getElementById("pprice").value = "";
      document.getElementById("pqty").value = "";
      loadProduct();
    } else {
      alert("Failed to add product");
    }
  } catch (error) {
    console.error("Error adding product:", error);
    alert("Error adding product");
  }
}

/* DELETE PRODUCT */
async function deleteProduct(id){
  if(await showConfirm("Are you sure you want to delete this product?")){
    try {
      const response = await fetch(`/api/products/${id}`, {
        method: 'DELETE'
      });
      if (response.ok) {
        loadProduct();
      } else {
        alert("Failed to delete product");
      }
    } catch (error) {
      console.error("Error deleting product:", error);
      alert("Error deleting product");
    }
  }
}

/* LOGOUT */
async function logout(){
  if(await showConfirm("Are you sure you want to logout?")){
    localStorage.clear();
    alert("Logged out successfully");
    window.location.href = "a_login.html";
  }
}

/* DARK MODE */
function toggleMode(){
  document.body.classList.toggle("dark-mode");
}
</script>

</body>
</html>
