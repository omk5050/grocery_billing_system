<!DOCTYPE html>
<html>
<head>

  <title>Bill History</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="style.css">
  <script src="toast.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
  /* Modal styling */
  .modal {
    display: none;
    position: fixed;
    z-index: 1000;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    overflow: auto;
    background-color: rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(4px);
  }

  .modal-content {
    background-color: var(--surface);
    margin: 8% auto;
    padding: 2.5rem;
    border: 1px solid var(--border);
    width: 90%;
    max-width: 650px;
    border-radius: var(--radius);
    box-shadow: var(--shadow-lg);
    position: relative;
    color: var(--text-main);
  }

  .close-btn {
    color: var(--text-muted);
    position: absolute;
    top: 1rem;
    right: 1.5rem;
    font-size: 2.2rem;
    font-weight: bold;
    cursor: pointer;
    transition: color 0.2s;
    line-height: 1;
  }

  .close-btn:hover {
    color: var(--text-main);
  }
  </style>

</head>

<body onload="loadHistory()">

<!-- SIDEBAR -->
<div class="sidebar">

  <h2>🛒 Grocery</h2>

  <ul>
    <li onclick="go('b_dashboard.html')">Dashboard</li>

    <li onclick="go('c_product.html')">Product</li>

    <li onclick="go('d_billing.html')">Billing</li>

    <!-- FIXED HISTORY PAGE -->
    <li onclick="go('f_history.html')">History</li>

    <li onclick="go('h_register.html')">Register Admin</li>

    <li onclick="logout()">Logout</li>
  </ul>

  <button onclick="toggleMode()" class="mode-btn">
    🌙 Dark Mode
  </button>

</div>

<!-- MAIN CONTENT -->
<div class="main">

  <h2>🧾 Bill History</h2>

  <div id="historyContainer"></div>

</div>

<!-- Modal for Inspecting Invoice -->
<div id="invoiceModal" class="modal">
  <div class="modal-content">
    <span class="close-btn" onclick="closeModal()">&times;</span>
    <div id="modalInvoiceContent"></div>
    <div style="text-align: center; margin-top: 1.5rem; display: flex; gap: 10px; justify-content: center;">
      <button onclick="printInvoiceModal()" style="background: #3498db;">Print Invoice</button>
      <button onclick="downloadInvoicePDF()" style="background: #2ecc71;">Download Invoice</button>
    </div>
  </div>
</div>

<script>
/* ROUTE PROTECTION */
if (localStorage.getItem("isLoggedIn") !== "true") {
  window.location.href = "a_login.html";
}

let allBills = [];
let activeInspectedIndex = null;

/* PAGE NAVIGATION */
function go(page){
  window.location.href = page;
}

/* LOAD BILL HISTORY */
async function loadHistory(){

  let container = document.getElementById("historyContainer");
  container.innerHTML = "<p>Loading bills...</p>";

  try {
    const response = await fetch('/api/invoices');
    allBills = await response.json();

    container.innerHTML = "";

    /* NO BILLS */
    if(allBills.length === 0){
      container.innerHTML = "<p>No bills found</p>";
      return;
    }

    /* DISPLAY BILLS */
    allBills.forEach((bill,index)=>{
      let div = document.createElement("div");
      div.className = "card";

      let total = Number(bill.total) || 0;
      if (total === 0 && bill.items) {
        bill.items.forEach(item => {
          total += (Number(item.price) * Number(item.qty)) || 0;
        });
      }

      div.innerHTML = `
        <h3>Bill #${bill.invoice || (index+1)}</h3>
        <p><b>Date:</b> ${bill.dateTime || new Date(bill.createdAt).toLocaleString()}</p>
        <p><b>Customer:</b> ${bill.cname || "N/A"}</p>
        <p><b>Mobile:</b> ${bill.cmobile || "N/A"}</p>
        <h4>Total: ₹${total.toFixed(2)}</h4>
        <p><b>Payment:</b> ${bill.paymentType || "Cash"}</p>
        <div style="display: flex; gap: 10px; margin-top: 15px;">
          <button onclick="inspectBill(${index})" style="background: var(--primary);">Inspect</button>
          <button onclick="deleteBill('${bill._id}')" style="background: #e74c3c;">Delete</button>
        </div>
      `;

      container.appendChild(div);
    });
  } catch (error) {
    console.error("Error fetching bills:", error);
    container.innerHTML = "<p>Error loading bills</p>";
  }
}

/* INSPECT BILL DETAIL */
function inspectBill(index) {
  let bill = allBills[index];
  if (!bill) return;
  activeInspectedIndex = index;

  let modal = document.getElementById("invoiceModal");
  let content = document.getElementById("modalInvoiceContent");

  let itemsHTML = "";
  let subtotal = 0;
  
  if (bill.items) {
    bill.items.forEach((item, idx) => {
      let itemTotal = Number(item.total) || (Number(item.price) * Number(item.qty)) || 0;
      subtotal += itemTotal;
      itemsHTML += `
        <tr>
          <td>${idx + 1}</td>
          <td>${item.name}</td>
          <td>₹${Number(item.price).toFixed(2)}</td>
          <td>${item.qty}</td>
          <td>₹${itemTotal.toFixed(2)}</td>
        </tr>
      `;
    });
  }

  let gstPercent = Number(bill.gst) || 0;
  let discPercent = Number(bill.discount) || 0;
  let gstAmt = subtotal * gstPercent / 100;
  let discAmt = subtotal * discPercent / 100;
  let grandTotal = subtotal + gstAmt - discAmt;

  content.innerHTML = `
    <div style="text-align: center; margin-bottom: 1.5rem; border-bottom: 2px solid var(--border); padding-bottom: 1rem;">
      <h2>Grocery Store</h2>
      <small style="color: var(--text-muted)">Main Road, Solapur</small>
    </div>
    
    <div style="display: flex; justify-content: space-between; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 10px;">
      <div>
        <p><b>Invoice No:</b> ${bill.invoice || "N/A"}</p>
        <p><b>Date:</b> ${bill.dateTime || new Date(bill.createdAt).toLocaleString()}</p>
      </div>
      <div style="text-align: right;">
        <p><b>Customer:</b> ${bill.cname || "N/A"}</p>
        <p><b>Mobile:</b> ${bill.cmobile || "N/A"}</p>
      </div>
    </div>

    <div class="table-wrap" style="margin-bottom: 1.5rem;">
      <table style="width: 100%;">
        <thead>
          <tr>
            <th style="padding: 0.5rem 1rem;">#</th>
            <th style="padding: 0.5rem 1rem;">Item</th>
            <th style="padding: 0.5rem 1rem;">Price</th>
            <th style="padding: 0.5rem 1rem;">Qty</th>
            <th style="padding: 0.5rem 1rem;">Total</th>
          </tr>
        </thead>
        <tbody>
          ${itemsHTML || "<tr><td colspan='5' style='text-align:center;'>No items in this invoice</td></tr>"}
        </tbody>
      </table>
    </div>

    <div style="text-align: right; line-height: 1.8; border-top: 1px solid var(--border); padding-top: 1rem;">
      <p>Sub Total: ₹${subtotal.toFixed(2)}</p>
      <p>GST (${gstPercent}%): ₹${gstAmt.toFixed(2)}</p>
      <p>Discount (${discPercent}%): ₹${discAmt.toFixed(2)}</p>
      <h3 style="color: var(--primary); margin-top: 0.5rem; font-size: 1.5rem;">Grand Total: ₹${grandTotal.toFixed(2)}</h3>
      <p style="margin-top: 0.5rem;"><b>Payment Method:</b> ${bill.paymentType || "Cash"}</p>
    </div>
  `;

  modal.style.display = "block";
}

function closeModal() {
  document.getElementById("invoiceModal").style.display = "none";
}

window.onclick = function(event) {
  let modal = document.getElementById("invoiceModal");
  if (event.target == modal) {
    modal.style.display = "none";
  }
}

/* PRINT INVOICE MODAL */
function printInvoiceModal() {
  let bill = allBills[activeInspectedIndex];
  if (!bill) return;

  let printWindow = window.open("", "_blank", "width=800,height=600");
  
  let itemsHTML = "";
  let subtotal = 0;
  if (bill.items) {
    bill.items.forEach((item, idx) => {
      let itemTotal = Number(item.total) || (Number(item.price) * Number(item.qty)) || 0;
      subtotal += itemTotal;
      itemsHTML += `
        <tr>
          <td style="padding: 8px; border-bottom: 1px solid #ddd;">${idx + 1}</td>
          <td style="padding: 8px; border-bottom: 1px solid #ddd;">${item.name}</td>
          <td style="padding: 8px; border-bottom: 1px solid #ddd;">₹${Number(item.price).toFixed(2)}</td>
          <td style="padding: 8px; border-bottom: 1px solid #ddd;">${item.qty}</td>
          <td style="padding: 8px; border-bottom: 1px solid #ddd;">₹${itemTotal.toFixed(2)}</td>
        </tr>
      `;
    });
  }

  let gstPercent = Number(bill.gst) || 0;
  let discPercent = Number(bill.discount) || 0;
  let gstAmt = subtotal * gstPercent / 100;
  let discAmt = subtotal * discPercent / 100;
  let grandTotal = subtotal + gstAmt - discAmt;

  printWindow.document.write(`
    <html>
      <head>
        <title>Invoice #${bill.invoice || activeInspectedIndex + 1}</title>
        <style>
          body { font-family: 'Segoe UI', sans-serif; padding: 20px; color: #333; }
          .receipt { max-width: 600px; margin: auto; border: 1px solid #ddd; padding: 20px; border-radius: 8px; }
          table { width: 100%; border-collapse: collapse; margin-top: 20px; }
          th { background: #f4f4f4; padding: 8px; text-align: left; border-bottom: 2px solid #ddd; }
          .total-section { text-align: right; margin-top: 20px; line-height: 1.6; }
        </style>
      </head>
      <body>
        <div class="receipt">
          <div style="text-align: center; border-bottom: 2px solid #ddd; padding-bottom: 10px;">
            <h2>Grocery Store</h2>
            <small>Main Road, Solapur</small>
          </div>
          <div style="display: flex; justify-content: space-between; margin-top: 20px; font-size: 14px;">
            <div>
              <p><b>Invoice No:</b> ${bill.invoice || "N/A"}</p>
              <p><b>Date:</b> ${bill.dateTime || new Date(bill.createdAt).toLocaleString()}</p>
            </div>
            <div style="text-align: right;">
              <p><b>Customer:</b> ${bill.cname || "N/A"}</p>
              <p><b>Mobile:</b> ${bill.cmobile || "N/A"}</p>
            </div>
          </div>
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Item</th>
                <th>Price</th>
                <th>Qty</th>
                <th>Total</th>
              </tr>
            </thead>
            <tbody>
              ${itemsHTML}
            </tbody>
          </table>
          <div class="total-section">
            <p>Sub Total: ₹${subtotal.toFixed(2)}</p>
            <p>GST (${gstPercent}%): ₹${gstAmt.toFixed(2)}</p>
            <p>Discount (${discPercent}%): ₹${discAmt.toFixed(2)}</p>
            <h3 style="color: #10b981; font-size: 18px; margin-top: 10px;">Grand Total: ₹${grandTotal.toFixed(2)}</h3>
            <p style="font-size: 13px; margin-top: 5px;"><b>Payment Method:</b> ${bill.paymentType || "Cash"}</p>
          </div>
        </div>
        <script>
          window.onload = function() {
            window.print();
            setTimeout(function() { window.close(); }, 500);
          }
        <\/script>
      </body>
    </html>
  `);
  printWindow.document.close();
}

/* DOWNLOAD INVOICE PDF */
function downloadInvoicePDF() {
  let bill = allBills[activeInspectedIndex];
  if (!bill) return;

  const { jsPDF } = window.jspdf;
  let doc = new jsPDF();
  
  doc.setFontSize(22);
  doc.text("Grocery Store Invoice", 20, 20);
  doc.setFontSize(10);
  doc.text("Main Road, Solapur", 20, 26);
  
  doc.line(20, 30, 190, 30);
  
  doc.setFontSize(12);
  doc.text("Invoice No: " + (bill.invoice || "N/A"), 20, 40);
  doc.text("Date: " + (bill.dateTime || new Date(bill.createdAt).toLocaleString()), 20, 47);
  
  doc.text("Customer Name: " + (bill.cname || "N/A"), 120, 40);
  doc.text("Mobile Number: " + (bill.cmobile || "N/A"), 120, 47);
  
  doc.line(20, 52, 190, 52);
  
  let y = 60;
  doc.text("Item Name", 20, y);
  doc.text("Price", 90, y);
  doc.text("Qty", 130, y);
  doc.text("Total", 160, y);
  doc.line(20, y+2, 190, y+2);
  y += 10;
  
  let subtotal = 0;
  if (bill.items) {
    bill.items.forEach(item => {
      let itemTotal = Number(item.total) || (Number(item.price) * Number(item.qty)) || 0;
      subtotal += itemTotal;
      
      doc.text(item.name, 20, y);
      doc.text("₹" + Number(item.price).toFixed(2), 90, y);
      doc.text(String(item.qty), 130, y);
      doc.text("₹" + itemTotal.toFixed(2), 160, y);
      y += 8;
    });
  }
  
  doc.line(20, y, 190, y);
  y += 8;
  
  let gstPercent = Number(bill.gst) || 0;
  let discPercent = Number(bill.discount) || 0;
  let gstAmt = subtotal * gstPercent / 100;
  let discAmt = subtotal * discPercent / 100;
  let grandTotal = subtotal + gstAmt - discAmt;
  
  doc.text("Subtotal: ₹" + subtotal.toFixed(2), 130, y);
  y += 6;
  doc.text(`GST (${gstPercent}%): ₹` + gstAmt.toFixed(2), 130, y);
  y += 6;
  doc.text(`Discount (${discPercent}%): ₹` + discAmt.toFixed(2), 130, y);
  y += 8;
  
  doc.setFontSize(14);
  doc.text("Grand Total: ₹" + grandTotal.toFixed(2), 120, y);
  y += 8;
  doc.setFontSize(12);
  doc.text("Payment Method: " + (bill.paymentType || "Cash"), 20, y);
  
  doc.save(`invoice_${bill.invoice || activeInspectedIndex + 1}.pdf`);
}

/* DELETE BILL */
async function deleteBill(id){
  if (await showConfirm("Are you sure you want to delete this bill?")) {
    try {
      const response = await fetch(`/api/invoices/${id}`, {
        method: 'DELETE'
      });
      if (response.ok) {
        loadHistory();
      } else {
        alert("Failed to delete bill");
      }
    } catch (error) {
      console.error("Error deleting bill:", error);
      alert("Error connecting to server");
    }
  }
}

/* LOGOUT */
async function logout(){
  if (await showConfirm("Are you sure you want to logout?")) {
    localStorage.clear();
    alert("Logged out successfully");
    window.location.href = "a_login.html";
  }
}

/* DARK MODE */
function toggleMode(){

  document.body.classList.toggle("dark-mode");
}

</script>

</body>
</html>
