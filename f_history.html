<!DOCTYPE html>
<html>
<head>

  <title>Bill History</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="style.css">

</head>

<body onload="loadHistory()">

<!-- SIDEBAR -->
<div class="sidebar">

  <h2>🛒 Grocery</h2>

  <ul>
    <li onclick="go('b_dashboard.html')">Dashboard</li>

    <li onclick="go('c_product.html')">Product</li>

    <li onclick="go('d_billing.html')">Billing</li>

    <li onclick="go('e_invoice.html')">Invoice</li>

    <!-- FIXED HISTORY PAGE -->
    <li onclick="go('f_history.html')">History</li>

    <li onclick="go('g_report.html')">Report</li>

    <li onclick="logout()">Logout</li>
  </ul>

  <button onclick="toggleMode()" class="mode-btn">
    🌙 Dark Mode
  </button>

</div>

<!-- MAIN CONTENT -->
<div class="main">

  <h2>🧾 Bill History</h2>

  <div id="historyContainer"></div>

</div>

<script>

/* PAGE NAVIGATION */
function go(page){
  window.location.href = page;
}

/* LOAD BILL HISTORY */
async function loadHistory(){

  let container = document.getElementById("historyContainer");
  container.innerHTML = "<p>Loading bills...</p>";

  try {
    const response = await fetch('/api/invoices');
    const bills = await response.json();

    container.innerHTML = "";

    /* NO BILLS */
    if(bills.length === 0){
      container.innerHTML = "<p>No bills found</p>";
      return;
    }

    /* DISPLAY BILLS */
    bills.forEach((bill,index)=>{
      let div = document.createElement("div");
      div.className = "card";
      let itemsHTML = "";

      /* ITEMS */
      if(bill.items){
        bill.items.forEach(item=>{
          itemsHTML += `
          <p>
            ${item.name}
            - ₹${item.price}
            × ${item.qty}
          </p>
          `;
        });
      }

      /* TOTAL CALCULATION */
      let total = 0;
      if(bill.items){
        bill.items.forEach(item=>{
          total += item.total;
        });
      }

      div.innerHTML = `
        <h3>Bill #${bill.invoice || (index+1)}</h3>
        <p><b>Date:</b> ${bill.dateTime || new Date(bill.createdAt).toLocaleString()}</p>
        <p><b>Customer:</b> ${bill.cname || "N/A"}</p>
        <p><b>Mobile:</b> ${bill.cmobile || "N/A"}</p>
        ${itemsHTML}
        <h4>Total: ₹${bill.total || total}</h4>
        <p><b>Payment:</b> ${bill.paymentType || "Cash"}</p>
        <button onclick="deleteBill('${bill._id}')">Delete</button>
      `;

      container.appendChild(div);
    });
  } catch (error) {
    console.error("Error fetching bills:", error);
    container.innerHTML = "<p>Error loading bills</p>";
  }
}

/* DELETE BILL */
async function deleteBill(id){
  if (confirm("Are you sure you want to delete this bill?")) {
    try {
      const response = await fetch(`/api/invoices/${id}`, {
        method: 'DELETE'
      });
      if (response.ok) {
        loadHistory();
      } else {
        alert("Failed to delete bill");
      }
    } catch (error) {
      console.error("Error deleting bill:", error);
      alert("Error connecting to server");
    }
  }
}

/* LOGOUT */
function logout(){

  alert("Logged out successfully");

  localStorage.clear();

  window.location.href = "a_login.html";
}

/* DARK MODE */
function toggleMode(){

  document.body.classList.toggle("dark-mode");
}

</script>

</body>
</html>
